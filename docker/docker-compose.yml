version: "3.9"

services:
  auth-service:
    build: ../services/auth-service
    ports:
      - "8001:8001"

  product-service:
    build: ../services/product-service
    ports:
      - "8002:8002"

  cart-service:
    build: ../services/cart-service
    ports:
      - "8003:8003"

  order-service:
    build: ../services/order-service
    ports:
      - "8004:8004"

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: admin123
      DB_NAME: stylesphere

    depends_on:
      - postgres

  payment-service:
    build: ../services/payment-service
    ports:
      - "8005:8005"

  notification-service:
    build: ../services/notification-service
    ports:
      - "8006:8006"

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: stylesphere

    ports:
      - "5432:5432"

  redis:
    image: redis:7

    ports:
      - "6379:6379"